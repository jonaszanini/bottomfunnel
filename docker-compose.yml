services:
  postgres:
    image: postgres:16-alpine
    container_name: bottomfunnel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bottomfunnel
      POSTGRES_PASSWORD: bottomfunnel
      POSTGRES_DB: bottomfunnel
    ports:
      - "5432:5432"
    volumes:
      - bottomfunnel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottomfunnel -d bottomfunnel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bottomfunnel_pgdata:
