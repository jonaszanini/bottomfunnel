name: Run artisan (manual)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Artisan task to run on production"
        required: true
        type: choice
        options:
          - "watching:backfill-compliance --dry-run"
          - "watching:backfill-compliance"
          - "migrate --force"
          - "migrate:status"
          - "optimize:clear"
          - "config:cache"
          - "db:seed --force"

jobs:
  artisan:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Configure SSH known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf "%s\n" "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Run artisan with PHP 8.3
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TASK: ${{ inputs.task }}
        run: |
          ssh -p "${SSH_PORT}" -o ConnectTimeout=60 "${SSH_USER}@${SSH_HOST}" \
            "cd ~/domains/bottomfunnel.app/public_html && /opt/alt/php83/usr/bin/php artisan ${TASK} --no-interaction"
